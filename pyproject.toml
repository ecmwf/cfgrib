[build-system]
requires = [ "setuptools>=61", "setuptools-scm>=8" ]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.pytest.ini_options]
norecursedirs = [
    "build",
    "docs",
    ".tox",
]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
branch = true
omit = ["setup.py"]
