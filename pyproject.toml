[build-system]
requires = ["hatchling","hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "cfgrib"
dynamic = ["readme", "version"]
description = "Python interface to map GRIB files to the NetCDF Common Data Model following the CF Convention using ecCodes."
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["eccodes", "grib", "xarray"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["attrs>=19.2", "click", "eccodes>=0.9.8", "numpy"]

[dependency-groups]
test = [
  "dask[array]",
  "pytest",
  "pytest-cov",
  "scipy",
  "xarray<2025.6.0",
]
docs = [
  "attrs",
  "cffi",
  "eccodes",
  "future",
  "nomkl",
  "sphinx",
  "xarray<2025.6.0",
]
qc = [
  "dask[array]",
  "flake8",
  "pytest",
  "pytest-cov",
  "scipy",
  "xarray<2025.6.0",
]

[[project.authors]]
name = "European Centre for Medium-Range Weather Forecasts (ECMWF)"
email = "software.support@ecmwf.int"

[project.optional-dependencies]
xarray = ["xarray<2025.6.0"]

[project.scripts]
cfgrib = "cfgrib.__main__:cfgrib_cli"

[project.entry-points."xarray.backends"]
cfgrib = "cfgrib.xarray_plugin:CfGribBackend"

[project.urls]
Homepage = "https://github.com/ecmwf/cfgrib"

[tool.check-wheel-contents]
ignore = ["W009"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/x-rst"
fragments = [
  { path = "README.rst" },
  { path = "CHANGELOG.rst" },
]

[tool.hatch.version]
path = "cfgrib/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["cf2cdm", "cfgrib"]

[tool.hatch.build.targets.wheel]
include = ["cf2cdm", "cfgrib"]

[[tool.mypy.overrides]]
module = "cfgrib.xarray_plugin"
ignore_errors = true

[tool.zest-releaser]
python-file-with-version = "cfgrib/__init__.py"
create-wheel = true

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.pytest.ini_options]
norecursedirs = ["build", "docs", ".tox"]

[tool.hatch.envs.test]
dependency-groups = [
  "test",
]

[tool.hatch.envs.test.scripts]
run = "pytest -v --cache-clear {args}"

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.docs]
dependency-groups = [
  "docs",
]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -W -b html docs build/sphinx/html"

[tool.hatch.envs.qc]
dependency-groups = [
  "qc",
]

[tool.hatch.envs.qc.scripts]
run = "pytest -v --cov=cfgrib --cov=cf2cdm --cov-report=html --cache-clear {args}"

[tool.coverage.run]
branch = true
omit = ["setup.py"]
